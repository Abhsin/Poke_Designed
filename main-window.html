<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' http://127.0.0.1:11434 http://localhost:11434;">
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta http-equiv="X-Frame-Options" content="DENY">
    <meta http-equiv="X-XSS-Protection" content="1; mode=block">
    <title>Poke - Main Window</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=DynaPuff:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <!-- Custom Title Bar -->
        <div class="title-bar">
            <div class="title-bar-left">
                <div class="brand-icon">
                    <div class="brand-logo">
                        <img src="assets/Logo.svg" alt="Poke Logo" width="26" height="29">
                    </div>
                    <span class="brand-text">Poke</span>
                </div>
            </div>
            
            <!-- Empty Center Section -->
            <div class="title-bar-center">
            </div>
            
            <div class="title-bar-right">
                <!-- Connection Status -->
                <div class="connection-status">
                    <div class="status-icon connected" id="connectionStatus">
                        <img src="assets/Property 1=Connected.svg" alt="Connected" width="16" height="16">
                    </div>
                </div>
                
                <!-- AI Model Selector - MOVED TO RIGHT SIDE -->
                <div class="ai-model-selector" id="modelSelector">
                    <span class="model-text">Gemini</span>
                    <div class="dropdown-icon">
                        <img src="assets/Property 1=DropDown.svg" alt="Dropdown" width="16" height="16">
                    </div>
                </div>
                
                <!-- Settings Button -->
                <button class="title-bar-button" id="settingsBtn">
                    <img src="assets/Property 1=Settings.svg" alt="Settings" width="16" height="16">
                </button>
                
                <!-- Exit Button -->
                <button class="title-bar-button close-btn" id="closeBtn">
                    <img src="assets/Property 1=Exit.svg" alt="Close" width="16" height="16">
                </button>
            </div>
        </div>

        <!-- Main Content -->
        <div class="main-content">
            <div class="chat-container">
                <!-- Chat Messages Area -->
                <div class="chat-messages">
                    <!-- Messages will be dynamically added here -->
                </div>
                
                <!-- Input Area -->
                <div class="chat-input-area">
                    <div class="input-container">
                        <textarea 
                            class="chat-input" 
                            placeholder="Ask your AI or generate images (e.g., 'create an image of...')" 
                            id="chatInput"
                            rows="1"
                        ></textarea>
                    </div>
                    
                    <!-- Action Buttons -->
                    <div class="action-buttons">
                        <div class="action-buttons-left">
                            <button class="action-btn" id="pointBtn">
                                <div class="action-icon">
                                    <img src="assets/Property 1=PokePoint.svg" alt="Point" width="16" height="16">
                                </div>
                                <span class="action-text">Point</span>
                            </button>
                            
                            <button class="action-btn" id="shareScreenBtn">
                                <div class="action-icon">
                                    <img src="assets/Property 1=Window.svg" alt="Share Screen" width="16" height="16">
                                </div>
                                <span class="action-text">Share Current Screen</span>
                            </button>
                        </div>
                        
                        <button class="action-btn send-btn" id="sendBtn">
                            <div class="action-icon">
                                <img src="assets/Property 1=PaperPlane.svg" alt="Send" width="16" height="16">
                            </div>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="main-window-renderer.js"></script>
</body>
</html>
