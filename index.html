<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' http://127.0.0.1:11434 http://localhost:11434;">
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta http-equiv="X-Frame-Options" content="DENY">
    <meta http-equiv="X-XSS-Protection" content="1; mode=block">
    <title>Poke</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=DynaPuff:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <!-- Custom Title Bar -->
        <div class="title-bar">
            <div class="title-bar-left">
                <div class="brand-icon">
                    <div class="brand-logo">
                        <img src="assets/Logo.svg" alt="Poke Logo" width="26" height="29">
                    </div>
                    <span class="brand-text">Poke</span>
                </div>
            </div>
            <div class="title-bar-right">
                <button class="title-bar-button" id="minimizeBtn">
                    <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                        <path d="M2 8H14" stroke="#f4fffd" stroke-width="2" stroke-linecap="round"/>
                    </svg>
                </button>
                <button class="title-bar-button" id="maximizeBtn">
                    <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                        <rect x="3" y="3" width="10" height="10" stroke="#f4fffd" stroke-width="2"/>
                    </svg>
                </button>
                <button class="title-bar-button close-btn" id="closeBtn">
                    <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                        <path d="M12 4L4 12M4 4L12 12" stroke="#f4fffd" stroke-width="2" stroke-linecap="round"/>
                    </svg>
                </button>
            </div>
        </div>

        <!-- Main Content -->
        <div class="main-content">
            <div class="signup-container">
                <div class="brand-section">
                    <div class="brand-mark">
                        <div class="logo-container">
                            <img src="assets/Logo.svg" alt="Poke Logo" width="60" height="68">
                        </div>
                        <h1 class="brand-title">Poke</h1>
                    </div>
                </div>
                
                <div class="button-section">
                    <button class="start-button" id="startBtn">
                        <span class="button-text">Start</span>
                        <div class="button-icon">
                            <svg width="32" height="32" viewBox="0 0 24 24" fill="none">
                                <path d="M5 12h14m-7-7l7 7-7 7" stroke="#f4fffd" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            </svg>
                        </div>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="renderer.js"></script>
</body>
</html>
